name: Build and publish OpenClaw Tools

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: write
  packages: write

concurrency:
  group: openclaw-tools-publish
  cancel-in-progress: false

jobs:
  resolve-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: resolve
        name: Select latest upstream stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(gh api repos/openclaw/openclaw/releases/latest --jq '.tag_name' | sed 's/^v//')"
          [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$ ]] || { echo "Bad release version: $VERSION" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == schedule ]] && git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve-version
    if: needs.resolve-version.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and load native image
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
          IMAGE: ghcr.io/thtmnisamnstr/openclaw-tools
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"
          docker buildx build --pull --load \
            --platform "$PLATFORM" \
            --build-arg "OPENCLAW_VERSION=$VERSION" \
            --tag "$IMAGE:$VERSION-$ARCH" .
      - name: Smoke test tools and embedded OpenClaw version
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          IMAGE: ghcr.io/thtmnisamnstr/openclaw-tools
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"
          docker run --rm --entrypoint bash \
            -e "EXPECTED_OPENCLAW_VERSION=$VERSION" \
            "$IMAGE:$VERSION-$ARCH" -ec '
              set -euo pipefail
              for tool in node npm pnpm brew uv uvx bun go cargo rustc python3 pipx jq yq ffmpeg pdftotext; do
                command -v "$tool" >/dev/null || { echo "Missing $tool" >&2; exit 1; }
              done
              actual="$(node /app/openclaw.mjs --version)"
              echo "OpenClaw version: $actual"
              grep -F "$EXPECTED_OPENCLAW_VERSION" <<< "$actual" >/dev/null
              test -w /home/node/.local
              test -w /home/linuxbrew/.linuxbrew
            '
      - name: Publish tested architecture
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          IMAGE: ghcr.io/thtmnisamnstr/openclaw-tools
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"
          docker push "$IMAGE:$VERSION-$ARCH"

  publish:
    needs: [resolve-version, build]
    if: needs.resolve-version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble version and latest multi-architecture images
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          IMAGE: ghcr.io/thtmnisamnstr/openclaw-tools
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          docker buildx imagetools inspect --raw "$IMAGE:$VERSION" > /tmp/manifest.json
          jq -e '[.manifests[].platform.architecture] | (index("amd64") != null) and (index("arm64") != null)' /tmp/manifest.json
      - name: Create GitHub release only after publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          IMAGE: ghcr.io/thtmnisamnstr/openclaw-tools
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"
          git fetch --tags --force
          if ! git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "v$VERSION" -m "OpenClaw $VERSION tools image"
            git push origin "refs/tags/v$VERSION"
          fi
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            printf 'OpenClaw %s browser build with Homebrew, uv, Bun, Python, Go, Rust and media tools.\n\nImage: %s:%s\nArchitectures: amd64, arm64\n' "$VERSION" "$IMAGE" "$VERSION" > /tmp/release.md
            gh release create "v$VERSION" --verify-tag \
              --title "OpenClaw $VERSION (tools)" \
              --notes-file /tmp/release.md
          fi
